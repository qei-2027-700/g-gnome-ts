<!doctype html><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="script-src 'unsafe-inline' 'unsafe-eval' blob: https://cdn.jsdelivr.net http://127.0.0.1:5173/.artifacts/parallel-radio/tts.html"><title>Local radio voice synthesis</title><h1>Radio voice synthesis</h1><pre id="status">Loading browser synthesis package…</pre><button id="generate" disabled>Generate radio voices</button><textarea id="output" hidden></textarea><script type="module">
const status=document.querySelector('#status');try{const {KokoroTTS}=await import('https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/+esm');status.textContent='Loading local synthesis model…';const tts=await KokoroTTS.from_pretrained('onnx-community/Kokoro-82M-v1.0-ONNX',{dtype:'q8',device:'wasm',progress_callback:p=>{if(p.status==='progress')status.textContent=`Loading ${p.file}: ${Math.round(p.progress??0)}%`;}});status.textContent='Model ready';document.querySelector('#generate').disabled=false;
 document.querySelector('#generate').onclick=async()=>{try{document.querySelector('#generate').disabled=true;const tasks=await(await fetch('./tasks.json')).json();document.querySelector('#output').value='';for(const [index,task] of tasks.entries()){status.textContent=`Generating ${index+1}/${tasks.length}: ${task.id}`;let audio;if(task.phonemes){const {input_ids}=tts.tokenizer(task.phonemes,{truncation:true});audio=await tts.generate_from_ids(input_ids,{voice:task.voice,speed:task.rate});}else audio=await tts.generate(task.text,{voice:task.voice,speed:task.rate});const bytes=new Uint8Array(await audio.toBlob().arrayBuffer());if(bytes.length<1000)throw Error('Empty output: '+task.id);let raw='';for(const byte of bytes)raw+=String.fromCharCode(byte);const entry=document.createElement('textarea');entry.dataset.id=task.id;entry.hidden=true;entry.value=btoa(raw);document.body.append(entry);}status.textContent=`Complete: ${tasks.length} radio clips`;}catch(e){status.textContent=String(e.stack??e);}};
}catch(e){status.textContent=String(e.stack??e);}
</script>
